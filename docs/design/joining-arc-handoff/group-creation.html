<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Creation · Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== Dark identity tokens ===== */
    --surface-base: #15161e;
    --surface-raised: #20222d;
    --surface-self: #2d3040;
    --hairline: #363a49;
    --text-primary: #ECEDF2;
    --text-secondary: #A7AAB6;
    --text-faint: #6F7280;
    --lime: #a4ef4e;
    --lime-ink: #233006;
    --action: #18bccb;
    --action-ink: #0a2125;
    /* legacy aliases mapped onto the dark system */
    --paper: #15161e;
    --ink: #ECEDF2;
    --ink-soft: #A7AAB6;
    --ink-faint: #6F7280;
    --stroke: #363a49;
    --stroke-strong: #363a49;
    --fill: #20222d;
    --accent: #18bccb;
    --accent-soft: #14313a;
    --lime-tint: #1b2a10;
    --hand: 'Caveat', cursive;
    --display: 'Hanken Grotesk', system-ui, sans-serif;
    --ui: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--ui); }

  /* ---------- phone shell ---------- */
  .phone {
    width: 390px;
    height: 100%;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .statusbar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    flex: 0 0 auto;
  }
  .statusbar .dots { display: flex; gap: 4px; align-items: center; }
  .statusbar .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .statusbar .battery { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; }
  .statusbar .battery::after { content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: var(--ink); border-radius: 0 1px 1px 0; }
  .statusbar .battery::before { content: ''; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 60%; background: var(--ink); border-radius: 1px; }

  .navbar {
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    flex: 0 0 auto;
  }
  .chev {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--stroke-strong);
    border-radius: 50%;
    color: var(--ink-soft);
  }
  .progress { display: flex; gap: 6px; align-items: center; }
  .progress i { display: block; height: 5px; border-radius: 3px; background: var(--stroke); }
  .progress i.w { width: 26px; }
  .progress i.n { width: 8px; }
  .progress i.on { background: var(--ink); }
  .skip { font-size: 13px; color: var(--ink-faint); font-weight: 500; }

  .body { flex: 1 1 auto; padding: 8px 26px 0; display: flex; flex-direction: column; min-height: 0; }

  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  .headline { font-family: var(--hand); font-size: 40px; line-height: 1.02; color: var(--ink); margin: 10px 0 0; font-weight: 700; }
  .subline { font-size: 14.5px; line-height: 1.45; color: var(--ink-soft); margin: 10px 0 0; max-width: 30ch; }

  /* sketchy text area */
  .field {
    margin-top: 22px;
    border: 1.8px solid var(--stroke-strong);
    border-radius: 14px;
    padding: 16px 16px 14px;
    background: var(--surface-raised);
    position: relative;
    flex: 0 0 auto;
  }
  .field.grow { flex: 1 1 auto; min-height: 0; }
  .field .ph { font-size: 15px; line-height: 1.55; color: var(--ink-faint); }
  .field .caret { display:inline-block; width: 1.5px; height: 18px; background: var(--accent); vertical-align: -3px; margin-left: 1px; }
  .field .count { position: absolute; right: 12px; bottom: 9px; font-size: 11px; color: var(--ink-faint); }

  /* buttons */
  .cta {
    margin-top: 18px;
    height: 52px;
    border-radius: 30px;
    background: var(--ink);
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    font-size: 16px; font-weight: 600;
    flex: 0 0 auto;
  }
  .cta.ghost { background: transparent; color: var(--ink-soft); border: 1.6px solid var(--stroke-strong); }
  .cta.accent { background: var(--accent); }

  .ainote {
    display: flex; gap: 9px; align-items: flex-start;
    margin: 16px 4px 0;
    font-size: 12.5px; line-height: 1.4; color: var(--ink-soft);
  }
  .spark { flex: 0 0 auto; width: 18px; height: 18px; color: var(--accent); margin-top: 1px; }

  .home-ind { height: 26px; flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .home-ind i { width: 128px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; }

  /* ---------- B: chat ---------- */
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.8px solid var(--ink); display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; background: var(--accent-soft);
  }
  .orbit-head { display:flex; align-items:center; gap: 10px; padding: 4px 4px 2px; }
  .orbit-head .nm { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .orbit-head .st { font-size: 11.5px; color: var(--ink-faint); }
  .bubble {
    margin-top: 18px;
    background: var(--fill);
    border-radius: 18px 18px 18px 4px;
    padding: 14px 15px;
    font-size: 15px; line-height: 1.5; color: var(--ink);
    max-width: 86%;
  }
  .bubble.b2 { margin-top: 8px; }
  .reply-wrap { margin-top: auto; padding-bottom: 6px; }
  .reply {
    border: 1.8px solid var(--stroke-strong);
    border-radius: 20px;
    background: var(--surface-raised);
    padding: 14px 15px;
    min-height: 96px;
    position: relative;
  }
  .reply .ph { font-size: 14.5px; line-height: 1.5; color: var(--ink-faint); }
  .send {
    position: absolute; right: 9px; bottom: 9px;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent); color: var(--text-primary);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- C: chips ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip {
    border: 1.6px solid var(--stroke-strong);
    border-radius: 20px;
    padding: 7px 13px;
    font-size: 13px; color: var(--ink-soft);
    display: flex; gap: 6px; align-items: center;
  }
  .chip .pl { color: var(--ink-faint); font-weight: 600; }
  .callout {
    margin-top: 16px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 10px 10px 0;
    padding: 11px 13px;
    font-size: 12.5px; line-height: 1.45; color: var(--ink-soft);
  }

  /* ---------- D: notecard ---------- */
  .nc-stage { flex: 1 1 auto; display:flex; flex-direction: column; justify-content: center; padding-bottom: 16px; min-height: 0; }
  .card {
    background: var(--surface-raised);
    border: 1.8px solid var(--stroke);
    border-radius: 16px;
    box-shadow: 6px 7px 0 rgba(43,43,43,.05);
    padding: 22px 20px 20px;
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; top: -7px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    width: 64px; height: 16px; background: rgba(24,188,203,.16); border: 1px solid var(--accent);
    border-radius: 2px;
  }
  .lines { margin-top: 14px; }
  .lines i { display:block; height: 1.5px; background: repeating-linear-gradient(90deg, var(--stroke) 0 8px, transparent 8px 14px); margin-bottom: 22px; }
  .lines .txt { font-family: var(--hand); font-size: 21px; color: var(--ink-soft); line-height: 1.9; }
  .tag {
    display:inline-flex; gap:6px; align-items:center;
    margin-top: 4px;
    background: var(--ink); color: var(--text-primary);
    font-size: 11px; font-weight: 600; letter-spacing: .03em;
    padding: 5px 10px; border-radius: 20px;
  }

  .cap {
    font-family: var(--hand);
    font-size: 20px;
    color: var(--ink-soft);
  }
  .cap b { color: var(--ink); font-weight: 700; }

  /* ---------- A+B refined: Orbit intro ---------- */
  .orbit-intro { display: flex; gap: 11px; align-items: flex-start; margin-top: 2px; }
  .orbit-intro .who { display: flex; align-items: center; gap: 7px; }
  .orbit-intro .who .nm { font-weight: 600; font-size: 14px; color: var(--ink); }
  .orbit-intro .who .st { font-size: 11px; color: var(--ink-faint); letter-spacing: .02em; }
  .orbit-intro .line { font-size: 15px; line-height: 1.4; color: var(--ink); margin-top: 4px; }
  .orbit-intro .line span { color: var(--ink-faint); }

  /* ---------- A+B v2: header moment ---------- */
  .ab2-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 18px; }
  .ab2-avatar {
    width: 104px; height: 104px; border-radius: 50%;
    border: 2px solid var(--stroke-strong);
    background: var(--surface-raised);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .ab2-avatar img { width: 86px; height: 86px; object-fit: contain; filter: grayscale(1) contrast(.92) brightness(1.02); }
  .ab2-step {
    margin-top: 16px;
    white-space: nowrap;
    font-family: var(--ui);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
  }
  .ab2-name {
    font-family: var(--display);
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -.01em;
    color: var(--ink);
    margin: 3px 0 0;
    line-height: 1;
  }
  .ab2-line {
    font-family: var(--ui);
    font-size: 16px; line-height: 1.45;
    color: var(--ink-soft);
    margin: 12px 0 0;
    max-width: 27ch;
  }
  .cta.lime { background: var(--lime); color: var(--lime-ink); }
  .cta.lime svg { stroke: var(--lime-ink); }
  .ainote.ab2-note { flex-direction: column; align-items: center; text-align: center; margin-top: 12px; }

  /* ===================== STEP 2 ===================== */
  .s2-body { flex: 1 1 auto; padding: 10px 22px 0; display: flex; flex-direction: column; min-height: 0; }
  .s2-top { display: flex; align-items: center; gap: 11px; padding: 4px 0 2px; flex: 0 0 auto; }
  .s2-av {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--stroke-strong); background: var(--surface-raised);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 auto;
  }
  .s2-av img { width: 36px; height: 36px; object-fit: contain; filter: grayscale(1) contrast(.92) brightness(1.02); }
  .s2-top .nm { font-family: var(--display); font-weight: 800; font-size: 19px; color: var(--ink); line-height: 1; }
  .s2-top .step { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; margin-top: 4px; }
  .s2-live { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-faint); font-weight: 600; }
  .s2-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px rgba(24,188,203,.22); }

  .s2-scroll { flex: 1 1 auto; min-height: 0; padding-top: 14px; }

  /* chat bubbles */
  .s2-bubble {
    background: var(--surface-raised); border: 1.5px solid var(--stroke);
    border-radius: 16px 16px 16px 5px;
    padding: 13px 14px; font-size: 15px; line-height: 1.5; color: var(--ink);
    max-width: 90%; margin-bottom: 9px;
  }
  .s2-bubble .lead { font-weight: 600; }
  .s2-typing { display: inline-flex; gap: 4px; align-items: center; }
  .s2-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); }

  .s2-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .s2-chip {
    border: 1.6px solid var(--stroke-strong); background: var(--surface-raised);
    border-radius: 9px; padding: 8px 11px; font-size: 13px; color: var(--ink);
    display: flex; align-items: center; gap: 7px;
  }
  .s2-chip .k { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .s2-chip .pen { color: var(--ink-faint); }
  .s2-ask { color: var(--ink-soft); font-size: 14px; margin: 12px 2px 0; }

  /* summary card (V2) */
  .s2-card {
    border: 1.8px solid var(--stroke); border-radius: 16px; background: var(--surface-raised);
    box-shadow: 5px 6px 0 rgba(43,43,43,.04);
    overflow: hidden; margin-top: 4px;
  }
  .s2-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 15px; border-bottom: 1.4px solid var(--stroke);
  }
  .s2-row:last-child { border-bottom: 0; }
  .s2-row .lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; width: 64px; flex: 0 0 auto; }
  .s2-row .val { font-size: 15.5px; color: var(--ink); font-weight: 500; flex: 1 1 auto; }
  .s2-row .pen { color: var(--ink-faint); flex: 0 0 auto; }
  .s2-row.gap { background: var(--surface-raised); }
  .s2-row.gap .val { color: var(--ink-faint); font-style: italic; font-weight: 400; }
  .s2-row .add { font-size: 12px; font-weight: 700; color: var(--ink); border: 1.5px solid var(--stroke-strong); border-radius: 20px; padding: 4px 10px; flex: 0 0 auto; }

  /* recap (V3) */
  .s2-recap { font-size: 19px; line-height: 1.6; color: var(--ink); margin: 2px 2px 0; }
  .s2-edit { border-bottom: 2px solid var(--stroke-strong); padding-bottom: 1px; font-weight: 600; }
  .s2-q {
    margin-top: 18px; border: 1.6px solid var(--stroke-strong); border-radius: 14px;
    padding: 14px 14px 13px; background: var(--surface-raised);
  }
  .s2-q .qlab { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .s2-q .qtxt { font-size: 16px; color: var(--ink); margin-top: 7px; line-height: 1.4; }
  .s2-replies { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .s2-reply { border: 1.6px solid var(--ink); border-radius: 20px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; color: var(--ink); background: var(--surface-raised); }

  /* shared step2 footer */
  .s2-foot { flex: 0 0 auto; padding-top: 10px; }
  .s2-fix { text-align: center; margin-top: 11px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); }
  .s2-fix u { text-decoration: none; border-bottom: 1.5px solid var(--stroke-strong); padding-bottom: 1px; }

  /* ---- V1 refined: static summary + chat input ---- */
  .s2-sumhead { font-weight: 600; font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .s2-sum { margin-top: 6px; }
  .s2-srow { display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1.4px solid var(--stroke); }
  .s2-srow:last-child { border-bottom: 0; padding-bottom: 0; }
  .s2-srow .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; width: 50px; flex: 0 0 auto; }
  .s2-srow .v { font-size: 15px; color: var(--ink); line-height: 1.4; flex: 1 1 auto; }
  .s2-upd { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .s2-talk { margin: 13px 2px 0; font-size: 13px; color: var(--ink-soft); }

  .s2-inwrap { flex: 0 0 auto; padding-top: 14px; }
  .s2-input { display: flex; align-items: center; gap: 10px; border: 1.8px solid var(--stroke-strong); border-radius: 26px; padding: 8px 8px 8px 16px; background: var(--surface-raised); }
  .s2-input .ftxt { flex: 1 1 auto; font-size: 14.5px; color: var(--ink); }
  .s2-input .ftxt.suggest { font-style: italic; color: var(--ink-faint); }
  .s2-input .caret { display: inline-block; width: 1.5px; height: 16px; background: var(--ink); vertical-align: -3px; margin-left: 1px; }
  .s2-send { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .s2-send.lime { background: var(--lime); }
  .s2-send.lime svg { stroke: var(--lime-ink); }
  .s2-send.plain { background: var(--surface-self); }
  .s2-send.plain svg { stroke: var(--ink-soft); }
  .s2-inhint { text-align: center; font-size: 12px; color: var(--ink-faint); margin-top: 10px; }
  .s2-inhint b { color: var(--ink-soft); font-weight: 600; }

  .s2-confirm2 { display: flex; justify-content: center; margin-top: 14px; }
  .s2-confirm2 .btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink); border: 1.8px solid var(--lime); background: var(--surface-raised); border-radius: 24px; padding: 10px 18px; }
  .s2-confirm2 .btn svg { stroke: var(--ink); }

  /* ---- Step 2 final: confirm chip + pinned input ---- */
  .s2-final-scroll { flex: 1 1 auto; min-height: 0; padding-top: 14px; display: flex; flex-direction: column; }
  .s2-card-bubble {
    background: var(--surface-raised); border: 1.5px solid var(--stroke);
    border-radius: 16px 16px 16px 5px; padding: 14px 15px; max-width: 95%; margin-bottom: 12px;
  }
  .s2-orbit-msg {
    background: var(--surface-raised); border: 1.5px solid var(--stroke);
    border-radius: 16px 16px 16px 5px; padding: 13px 15px;
    font-size: 15px; line-height: 1.5; color: var(--ink); max-width: 92%; margin-bottom: 12px;
  }
  .s2-chip-confirm {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--lime); color: var(--lime-ink);
    border-radius: 24px; padding: 12px 18px;
    font-size: 15px; font-weight: 700; line-height: 1;
    margin-left: 4px;
  }
  .s2-chip-confirm svg { stroke: var(--lime-ink); }
  .s2-pin { flex: 0 0 auto; padding: 12px 0 8px; border-top: 1.4px solid var(--stroke); margin-top: 4px; }

  /* ===== Step 2 rebalanced: chat is the hero ===== */
  /* summary = white structured card Orbit dropped into the thread */
  .s2r-card {
    background: var(--surface-raised); border: 1.7px solid var(--stroke-strong); border-radius: 14px;
    padding: 13px 15px; max-width: 96%; margin-bottom: 16px;
    box-shadow: 4px 5px 0 rgba(43,43,43,.04);
  }
  .s2r-cardtag { display: flex; align-items: center; gap: 6px; font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: 9px; }
  .s2r-cardtag svg { width: 12px; height: 12px; }

  /* Orbit speaking = avatar + solid-fill bubble, no solid */
  .s2r-msgrow { display: flex; gap: 9px; align-items: flex-end; margin-bottom: 12px; max-width: 93%; }
  .s2r-msgav { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--surface-raised); display: flex; align-items: center; justify-content: center; overflow: hidden; flex: 0 0 auto; }
  .s2r-msgav img { width: 23px; height: 23px; object-fit: contain; filter: grayscale(1) contrast(.92) brightness(1.02); }
  .s2r-msg { background: var(--ink); color: var(--text-primary); border-radius: 16px 16px 16px 5px; padding: 12px 14px; font-size: 14.5px; line-height: 1.5; }

  /* quick-reply chip (variation A) */
  .s2r-qr { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 0 37px; }
  .s2r-qrchip { display: inline-flex; align-items: center; gap: 7px; border: 1.8px solid var(--lime); background: var(--surface-raised); color: var(--ink); border-radius: 22px; padding: 9px 15px; font-size: 14px; font-weight: 700; }
  .s2r-qrchip svg { stroke: var(--ink); }

  /* live chat input (both variations) */
  .s2r-pin { flex: 0 0 auto; padding-top: 12px; }
  .s2r-input { display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink); border-radius: 26px; padding: 7px 7px 7px 16px; background: var(--surface-raised); box-shadow: 0 2px 0 rgba(43,43,43,.06); }
  .s2r-input .ftxt { flex: 1 1 auto; font-size: 14.5px; color: var(--ink-faint); }
  .s2r-input .caret { display: inline-block; width: 2px; height: 17px; background: var(--lime); vertical-align: -3px; margin-left: 1px; }
  .s2r-send { width: 40px; height: 40px; border-radius: 50%; background: var(--lime); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .s2r-send svg { stroke: var(--lime-ink); }
  .s2r-prompt { text-align: center; font-size: 12px; color: var(--ink-faint); margin-top: 9px; }

  /* quiet persistent confirm bar (variation B) */
  .s2r-confirmbar { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 0 3px; }
