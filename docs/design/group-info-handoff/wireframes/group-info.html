<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Info · Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== Dark identity tokens ===== */
    --surface-base: #15161e;
    --surface-raised: #20222d;
    --surface-self: #2d3040;
    --hairline: #363a49;
    --text-primary: #ECEDF2;
    --text-secondary: #A7AAB6;
    --text-faint: #6F7280;
    --lime: #a4ef4e;
    --lime-ink: #233006;
    --action: #18bccb;
    --action-ink: #0a2125;
    /* legacy aliases mapped onto the dark system */
    --paper: #15161e;
    --ink: #ECEDF2;
    --ink-soft: #A7AAB6;
    --ink-faint: #6F7280;
    --stroke: #363a49;
    --stroke-strong: #363a49;
    --fill: #20222d;
    --accent: #18bccb;
    --accent-soft: #14313a;
    --lime-tint: #1b2a10;
    --hand: 'Caveat', cursive;
    --display: 'Hanken Grotesk', system-ui, sans-serif;
    --ui: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--ui); }

  /* ---------- phone shell (matches group-home) ---------- */
  .phone {
    width: 390px; height: 100%;
    background: var(--paper);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .statusbar {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 13px; font-weight: 600; color: var(--ink); flex: 0 0 auto;
  }
  .statusbar .dots { display: flex; gap: 4px; align-items: center; }
  .statusbar .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .statusbar .battery { width: 22px; height: 11px; border: 1.5px solid var(--ink); border-radius: 3px; position: relative; }
  .statusbar .battery::after { content: ''; position: absolute; right: -3px; top: 3px; width: 2px; height: 5px; background: var(--ink); border-radius: 0 1px 1px 0; }
  .statusbar .battery::before { content: ''; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 60%; background: var(--ink); border-radius: 1px; }
  .home-ind { height: 26px; flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .home-ind i { width: 128px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; }

  /* ---------- group info page ---------- */
  .gi-scroll { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 24px 18px; display: flex; flex-direction: column; }

  .gi-back {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 0 2px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
    align-self: flex-start;
  }
  .gi-back svg { width: 18px; height: 18px; stroke: var(--ink-soft); }

  /* identity block */
  .gi-identity { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0 4px; }
  .gi-emblem {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid var(--stroke-strong); background: var(--surface-raised);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--ink-soft);
    letter-spacing: .02em;
  }
  .gi-name {
    font-family: var(--display); font-weight: 800; font-size: 28px;
    letter-spacing: -.01em; color: var(--ink); line-height: 1.05; margin-top: 12px;
  }
  .gi-count { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; margin-top: 4px; }

  /* rhythm card — read-only */
  .gi-card {
    margin-top: 16px;
    background: var(--surface-raised); border: 1.7px solid var(--stroke-strong); border-radius: 14px;
    box-shadow: 4px 5px 0 rgba(43,43,43,.04);
    padding: 13px 17px 5px;
  }
  .gi-row { display: flex; gap: 12px; padding: 9px 0 10px; }
  .gi-row + .gi-row { border-top: 1.4px solid var(--stroke); }
  .gi-row .k {
    flex: 0 0 58px; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 700; padding-top: 2.5px;
  }
  .gi-row .v { flex: 1 1 auto; min-width: 0; font-size: 13.5px; color: var(--ink); font-weight: 500; line-height: 1.4; }
  .gi-hint { font-size: 11.5px; color: var(--ink-faint); font-weight: 500; text-align: center; margin-top: 9px; }

  /* members — names only */
  .gi-seclabel {
    font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 700; margin: 18px 2px 7px;
  }
  .gi-members { display: inline; }
  .gi-members .sep { color: var(--stroke-strong); }

  /* invite block — Step 3 pattern */
  .gi-linkrow {
    display: flex; align-items: center; gap: 9px;
    border: 1.6px solid var(--stroke-strong); border-radius: 10px;
    background: var(--surface-base); padding: 11px 12px;
  }
  .gi-linkrow svg { width: 16px; height: 16px; stroke: var(--ink-faint); flex: 0 0 auto; }
  .gi-linkrow .url { font-size: 13.5px; color: var(--ink); font-weight: 500; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gi-sharebtn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    margin-top: 11px; height: 46px; border-radius: 24px;
    background: var(--lime); color: var(--lime-ink);
    font-size: 15px; font-weight: 700;
  }
  .gi-sharebtn svg { width: 17px; height: 17px; stroke: var(--lime-ink); }

  /* leave — outlined secondary, never buried */
  .gi-leave {
    margin-top: auto; height: 46px; border-radius: 24px; flex: 0 0 auto;
    border: 1.7px solid var(--stroke-strong); background: var(--surface-raised);
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
  }


/* =====================================================================
   DARK IDENTITY — role overrides (recolor pass over the wireframe base)
   surfaces base #15161e / raised #20222d / self #2d3040 / hairline #363a49
   Brand(Orbit)=lime · single Action=teal · Status=neutral + icon/label
   ===================================================================== */

/* Brand · Orbit identity = lime; mascot stays a flat lime placeholder for now */
.s2-av, .s2r-msgav, .jn-msgav, .gh-msgav, .ed-noteav,
.gh-homebtn, .gh-orbitdot, .ab2-avatar, .avatar {
  background: var(--lime); border: none;
}
.s2-av img, .s2r-msgav img, .jn-msgav img, .gh-msgav img, .ed-noteav img,
.gh-homebtn img, .gh-orbitdot img, .ab2-avatar img { display: none; }
.gi-emblem, .gh-gav { background: var(--lime); border: none; color: var(--lime-ink); }
.s2-live i { background: var(--lime); box-shadow: 0 0 0 3px rgba(164,239,78,.20); }

/* Action · ONE teal primary per screen, action-ink label */
.cta, .cta.lime, .cta.accent,
.jn-primary, .gh-rsvp .in, .s3-sharebtn, .gi-sharebtn,
.s2-send.lime, .s2-chip-confirm, .send {
  background: var(--action); color: var(--action-ink); border-color: var(--action);
}
.cta svg, .cta.lime svg, .cta.accent svg, .jn-primary svg, .gh-rsvp .in svg,
.s3-sharebtn svg, .gi-sharebtn svg, .s2-send.lime svg, .s2-chip-confirm svg,
.send svg { stroke: var(--action-ink); }
.cfA { background: var(--action); }
.cfA .lbl { color: var(--action-ink); }
.cfA .go { background: rgba(10,33,37,.20); }
.cfA .go svg { stroke: var(--action-ink); }

/* Chat voices — separated by STRUCTURE + fill, never hue */
.s2r-msg, .jn-msg, .gh-msg, .bubble, .s2-bubble,
.s2-orbit-msg, .s2-card-bubble {
  background: var(--surface-raised); color: var(--text-primary);
}
.s3-msg-light { background: var(--surface-raised) !important; color: var(--text-primary) !important; }
.gh-human .hmsg { background: transparent; border: 1.5px solid var(--hairline); color: var(--text-primary); }
.gh-self .smsg { background: var(--surface-self); color: var(--text-primary); }

/* Surfaces · cards & raised elements */
.cardX, .jn-card, .gh-evcard, .ed-card, .gi-card,
.card, .s2-card, .s2r-card {
  background: var(--surface-raised); box-shadow: 0 1px 3px rgba(0,0,0,.35);
}
.s3-link, .gi-linkrow { background: var(--surface-base); }
.s1-field, .s1-name, .field, .reply, .s2-q,
.s2r-input, .gh-input, .jn-input, .s2-input {
  background: var(--surface-raised); border-color: var(--hairline); box-shadow: none;
}
.s1-field .caret, .s2r-input .caret, .gh-input .caret,
.jn-input .caret, .s2-input .caret, .field .caret, .reply .caret { background: var(--text-primary); }

/* Secondary actions · outlined hairline, never filled */
.gh-rsvp .out, .ed-cal, .gi-leave, .s3-proceedB .btn.outline,
.gh-qrchip, .s2-reply, .s2r-qrchip, .cta.ghost {
  background: transparent; border-color: var(--hairline); color: var(--text-primary);
}
.gh-qrchip.quiet { color: var(--text-secondary); border-color: var(--hairline); }
.s3-proceedB .btn { background: var(--surface-raised); color: var(--text-primary); }
.s3-proceedB .btn svg, .s3-proceedB .btn.outline svg, .ed-cal svg, .gi-leave svg { stroke: var(--text-primary); }

/* Neutral send (composing a message is not the primary action) */
.gh-send, .s2r-send, .s2-send.plain { background: var(--surface-self); }
.gh-send svg, .s2r-send svg, .s2-send.plain svg { stroke: var(--text-secondary); }

/* Status · hue-free; meaning via icon + label (confirmed RSVP) */
.ed-band { background: transparent; border: 1.6px solid var(--hairline); }
.ed-band.footer { background: transparent; border: none; border-top: 1.6px solid var(--hairline); }
.ed-band .yin { color: var(--text-primary); }
.ed-band .yin svg { stroke: var(--text-primary); }
.ed-band .chg { color: var(--text-secondary); text-decoration-color: var(--hairline); }

/* Roster / member avatars — neutral, not Orbit */
.ed-av { background: var(--surface-raised); border: 1.6px solid var(--hairline); }
.ed-av svg { stroke: var(--text-primary); }
.ed-people.dim .ed-av { background: var(--surface-raised); border: 1.6px dashed var(--hairline); }
.ed-people.dim .ed-av svg { stroke: var(--text-faint); }

/* Orbit's inline prompt for missing info — lime dashed underline (a prompt, not a stroke) */
.s2-gap { border-bottom: 2px dashed var(--lime); color: var(--text-secondary); }
.s2-gap svg { stroke: var(--lime); }
.s2-srow.pending .k { color: var(--lime); }

/* exploration-only cleanup (keep abandoned variants legible in dark) */
.tag { background: var(--surface-self); color: var(--text-primary); }
.gh-datetile { border-color: var(--hairline); }
.gh-datetile .d { background: var(--surface-self); color: var(--text-primary); }
.gh-datetile .t { color: var(--text-primary); }
.gh-ppav .tick, .gh-mini .mbadge.yes { background: var(--surface-self); }
.gh-ppav .tick svg, .gh-mini .mbadge.yes svg { stroke: var(--text-primary); }
.callout { background: var(--surface-raised); border-left-color: var(--action); }

/* Board chrome (walkthrough gallery) → dark */
body { background: #0e0f16; }
.bd-frame { border-color: var(--hairline); box-shadow: 0 12px 40px rgba(0,0,0,.5); }

</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#9be83a"/>
    <rect x="34" y="20" width="32" height="60" rx="5" fill="#fff"/>
    <circle cx="50" cy="33" r="6" fill="#ececE7"/>
    <rect x="39" y="44" width="22" height="14" rx="2" fill="#ececE7"/>
    <rect x="39" y="64" width="22" height="8" rx="4" fill="#2b2b2b"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../design-canvas.jsx"></script>
<script type="text/babel">

function Status() {
  return (
    <div className="statusbar">
      <span>9:41</span>
      <div className="dots"><span></span><span></span><span></span><div className="battery"></div></div>
    </div>);
}
function HomeInd() { return <div className="home-ind"><i></i></div>; }
function ChevL() {
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-6 6 6 6" /></svg>;
}
function IconGlobe() {
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>;
}
function IconShare() {
  return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 15V4M8 8l4-4 4 4" /><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" /></svg>;
}

function PhoneGroupInfo() {
  const members = ["Jacob", "Jesse", "Maya", "Sam", "Dev", "Lena", "Priya", "Marcus"];
  return (
    <div className="phone">
      <Status />
      <div className="gi-scroll">
        <div className="gi-back"><ChevL /> Climbing Crew</div>

        <div className="gi-identity">
          <div className="gi-emblem">CC</div>
          <div className="gi-name">Climbing Crew</div>
          <div className="gi-count">8 members</div>
        </div>

        <div className="gi-seclabel">Group invite link</div>
        <div className="gi-linkrow">
          <IconGlobe />
          <span className="url">join.interplanetary.app/climbing-crew</span>
        </div>
        <div className="gi-sharebtn"><IconShare /> Share invite link</div>

        <div className="gi-card" style={{ marginTop: '18px' }}>
          <div className="gi-row"><span className="k">Who</span><span className="v gi-members">
            {members.map((m, i) => (
              <span key={m}>
                {i > 0 && <span className="sep">{" · "}</span>}
                <span>{m}</span>
              </span>
            ))}
          </span></div>
          <div className="gi-row"><span className="k">Climbs</span><span className="v">Mondays &amp; Wednesdays, mornings at 9</span></div>
          <div className="gi-row"><span className="k">Beers</span><span className="v">Now and then, about once a month</span></div>
        </div>
        <div className="gi-hint">Want to change something? Just tell Orbit in the chat.</div>

        <div className="gi-leave">Leave group</div>
      </div>
      <HomeInd />
    </div>);
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="group-info" title="Group info · sub-page" subtitle="Reached via “Climbing Crew ›” in the group home header · read-only rhythm (edits go through Orbit in chat), names-only members, Step-3 invite pattern with lime share · 390px">
        <DCArtboard id="gi-main" label="Group info — identity, rhythm, members, invite, leave" width={390} height={780}><PhoneGroupInfo /></DCArtboard>
      </DCSection>
    </DesignCanvas>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
